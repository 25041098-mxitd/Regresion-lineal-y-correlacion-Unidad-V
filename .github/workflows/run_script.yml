name: Ejecutar Script y Actualizar Graficas

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-python-script:

    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas scipy matplotlib scikit-learn

      - name: Ejecutar Script
        run: |
          python Codigo/Practica_Regresion.py

      - name: Subir Graficas Actualizadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add Graficas/

          git diff --staged --quiet || git commit -m "Actualizacion automatica de graficas"

          git push